<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />

<title>VietQuant Admin (design preview)</title>
<link rel="icon" href="../../public/favicon.png" />

    theme: {
      extend: {
        colors: {
          surface: { base: '#121212', card: '#1A1A1A', elevated: '#222222', border: '#2E2E2E', hover: '#2A2A2A' },

      },
    },
  };
