[tool.poetry]
name = "quantvn-blog"
version = "0.1.0"
description = "Quantvn Blog"
authors = ["Quantvn"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.4"
sqlalchemy = "2.0.36"
pydantic = {extras = ["email"], version = "^2.9.2"}
python-dotenv = "1.0.1"
black = "^25.1.0"
flake8 = "^7.1.2"
python-multipart = "^0.0.20"
gunicorn = "^23.0.0"
uvicorn = {extras = ["standard"], version = "^0.34.3"}
tzdata = "^2025.2"
azure-storage-blob = "^12.26.0"
python-slugify = "^8.0.4"
openai = "^1.107.1"
httpx = "^0.27.0"
trafilatura = "^1.12.0"
psycopg2-binary = "^2.9.11"
firebase-admin = "^6.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
