# STAGE 2 (final) -> replaces /etc/nginx/servers/vietquant-cms.conf after the cert exists.
server {
    listen 80;
    listen [::]:80;
    server_name vietquant.qtus.net;

    location /.well-known/acme-challenge/ {
        root /var/www/vqcms-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vietquant.qtus.net;

    ssl_certificate     /etc/letsencrypt/live/vietquant.qtus.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietquant.qtus.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 24m;   # MEDIA_MAX_UPLOAD_MB=20 plus multipart overhead

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Presigned image downloads from MinIO (read-only, signature-checked by MinIO).
    location /cms-media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9120;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # CMS API. X-Forwarded-For is overwritten, not appended: the app's rate limiter trusts it.
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;   # AI generation can be slow (gunicorn timeout is 120s)
    }
}
