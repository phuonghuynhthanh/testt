# STAGE 1 (HTTP only) -> /etc/nginx/servers/vietquant-cms.conf
# Only serves the Let's Encrypt challenge so certbot can issue a cert without touching other configs.
server {
    listen 80;
    listen [::]:80;
    server_name vietquant.qtus.net;

    location /.well-known/acme-challenge/ {
        root /var/www/vqcms-acme;
    }

    location / {
        return 404;
    }
}
